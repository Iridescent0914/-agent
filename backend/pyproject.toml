[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "math-teaching-agent-backend"
version = "0.1.0"
description = "M6 backend for the math teaching agent demo"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "Pillow>=11,<12",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
