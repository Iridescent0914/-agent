services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-math_agent}
      POSTGRES_USER: ${POSTGRES_USER:-math_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-math_agent_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-math_agent} -d ${POSTGRES_DB:-math_agent}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://math_agent:math_agent_dev@postgres:5432/math_agent}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-http://localhost:8000/assets}
      WEB_ASSET_DIR: ${WEB_ASSET_DIR:-/app/data/web}
      PUBLIC_TEACHER_ASSET_BASE_URL: ${PUBLIC_TEACHER_ASSET_BASE_URL:-http://localhost:8000/assets/teacher}
      TEACHER_ASSET_DIR: ${TEACHER_ASSET_DIR:-/app/data/web/teacher}
      QUESTION_ASSET_MAX_UPLOAD_BYTES: ${QUESTION_ASSET_MAX_UPLOAD_BYTES:-8388608}
      QUESTION_ASSET_MAX_PIXELS: ${QUESTION_ASSET_MAX_PIXELS:-20000000}
      TEACHER_ASSET_ORPHAN_GRACE_HOURS: ${TEACHER_ASSET_ORPHAN_GRACE_HOURS:-24}
      RECOGNITION_UPLOAD_DIR: ${RECOGNITION_UPLOAD_DIR:-/app/data/uploads/m6}
      RECOGNITION_MAX_UPLOAD_BYTES: ${RECOGNITION_MAX_UPLOAD_BYTES:-8388608}
      RECOGNITION_MAX_PIXELS: ${RECOGNITION_MAX_PIXELS:-20000000}
      RECOGNITION_RETENTION_DAYS: ${RECOGNITION_RETENTION_DAYS:-30}
      RECOGNITION_UNREVIEWED_MAX_RETENTION_DAYS: ${RECOGNITION_UNREVIEWED_MAX_RETENTION_DAYS:-180}
      RECOGNITION_PROCESSING_TIMEOUT_SECONDS: ${RECOGNITION_PROCESSING_TIMEOUT_SECONDS:-300}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_PROVIDER: ${VISION_PROVIDER:-fake}
      VISION_MODEL: ${VISION_MODEL:-fake-m6-v1}
      VISION_API_BASE_URL: ${VISION_API_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-45}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-2048}
      STAGE6_ENABLED: ${STAGE6_ENABLED:-false}
      STAGE6_WORKER_INTERVAL_SECONDS: ${STAGE6_WORKER_INTERVAL_SECONDS:-5}
      STAGE6_TIMEOUT_SECONDS: ${STAGE6_TIMEOUT_SECONDS:-10}
      STAGE6_LEASE_SECONDS: ${STAGE6_LEASE_SECONDS:-30}
      STAGE6_MAX_ATTEMPTS: ${STAGE6_MAX_ATTEMPTS:-3}
      STAGE6_VISION_PROVIDER: ${STAGE6_VISION_PROVIDER:-fake}
      STAGE6_VISION_TIMEOUT_SECONDS: ${STAGE6_VISION_TIMEOUT_SECONDS:-45}
      STAGE6_VISION_LEASE_SECONDS: ${STAGE6_VISION_LEASE_SECONDS:-120}
      STAGE6_VISION_API_KEY: ${STAGE6_VISION_API_KEY:-}
      STAGE6_VISION_BASE_URL: ${STAGE6_VISION_BASE_URL:-}
      STAGE6_VISION_MODEL: ${STAGE6_VISION_MODEL:-qwen3.8-flash}
      STAGE6_VISION_MAX_OUTPUT_TOKENS: ${STAGE6_VISION_MAX_OUTPUT_TOKENS:-8192}
      STAGE6_VISION_MAX_PIXELS: ${STAGE6_VISION_MAX_PIXELS:-4194304}
      STAGE6_VISION_MAX_CALLS: ${STAGE6_VISION_MAX_CALLS:-30}
      STAGE6_VISION_MAX_BUDGET_CNY: ${STAGE6_VISION_MAX_BUDGET_CNY:-2}
      STAGE6_EQUIVALENCE_PROVIDER: ${STAGE6_EQUIVALENCE_PROVIDER:-fake}
      STAGE6_EQUIVALENCE_API_KEY: ${STAGE6_EQUIVALENCE_API_KEY:-}
      STAGE6_EQUIVALENCE_BASE_URL: ${STAGE6_EQUIVALENCE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      STAGE6_EQUIVALENCE_MODEL: ${STAGE6_EQUIVALENCE_MODEL:-qwen3.7-flash}
      STAGE6_EQUIVALENCE_MAX_OUTPUT_TOKENS: ${STAGE6_EQUIVALENCE_MAX_OUTPUT_TOKENS:-512}
      STAGE6_EQUIVALENCE_MAX_CALLS: ${STAGE6_EQUIVALENCE_MAX_CALLS:-20}
      STAGE6_EQUIVALENCE_MAX_BUDGET_CNY: ${STAGE6_EQUIVALENCE_MAX_BUDGET_CNY:-1}
      QUESTION_IMPORT_DIR: ${QUESTION_IMPORT_DIR:-/app/data/uploads/question_imports}
      QUESTION_IMPORT_MAX_FILE_BYTES: ${QUESTION_IMPORT_MAX_FILE_BYTES:-31457280}
      QUESTION_IMPORT_MAX_BATCH_BYTES: ${QUESTION_IMPORT_MAX_BATCH_BYTES:-62914560}
      QUESTION_IMPORT_MAX_PDF_PAGES: ${QUESTION_IMPORT_MAX_PDF_PAGES:-50}
      QUESTION_IMPORT_MAX_FILES: ${QUESTION_IMPORT_MAX_FILES:-2}
      QUESTION_IMPORT_MAX_CANDIDATES: ${QUESTION_IMPORT_MAX_CANDIDATES:-200}
      QUESTION_IMPORT_RETENTION_HOURS: ${QUESTION_IMPORT_RETENTION_HOURS:-168}
      QUESTION_IMPORT_RECENT_BATCHES: ${QUESTION_IMPORT_RECENT_BATCHES:-100}
      QUESTION_IMPORT_WORKER_INTERVAL_SECONDS: ${QUESTION_IMPORT_WORKER_INTERVAL_SECONDS:-15}
      QUESTION_IMPORT_LEASE_SECONDS: ${QUESTION_IMPORT_LEASE_SECONDS:-120}
      QUESTION_IMPORT_MAX_ATTEMPTS: ${QUESTION_IMPORT_MAX_ATTEMPTS:-3}
      QUESTION_IMPORT_S2_ENABLED: ${QUESTION_IMPORT_S2_ENABLED:-false}
      QUESTION_IMPORT_S2_API_KEY: ${QUESTION_IMPORT_S2_API_KEY:-}
      QUESTION_IMPORT_S2_OPERATOR_TOKEN: ${QUESTION_IMPORT_S2_OPERATOR_TOKEN:-}
      QUESTION_IMPORT_S2_BASE_URL: ${QUESTION_IMPORT_S2_BASE_URL:-}
      QUESTION_IMPORT_S2_MODEL: ${QUESTION_IMPORT_S2_MODEL:-qwen3.8-flash}
      QUESTION_IMPORT_S2_TIMEOUT_SECONDS: ${QUESTION_IMPORT_S2_TIMEOUT_SECONDS:-360}
      QUESTION_IMPORT_S2_MAX_OUTPUT_TOKENS: ${QUESTION_IMPORT_S2_MAX_OUTPUT_TOKENS:-16384}
      QUESTION_IMPORT_S2_PAGES_PER_UNIT: ${QUESTION_IMPORT_S2_PAGES_PER_UNIT:-4}
      QUESTION_IMPORT_S2_OVERLAP_PAGES: ${QUESTION_IMPORT_S2_OVERLAP_PAGES:-1}
      QUESTION_IMPORT_S2_MAX_CALLS: ${QUESTION_IMPORT_S2_MAX_CALLS:-30}
      QUESTION_IMPORT_S2_MAX_BUDGET_CNY: ${QUESTION_IMPORT_S2_MAX_BUDGET_CNY:-20}
      QUESTION_IMPORT_S2_PDF_PAGE_PRICE_CNY: ${QUESTION_IMPORT_S2_PDF_PAGE_PRICE_CNY:-0.02}
      QUESTION_IMPORT_S2_INPUT_MILLION_PRICE_CNY: ${QUESTION_IMPORT_S2_INPUT_MILLION_PRICE_CNY:-0.8}
      QUESTION_IMPORT_S2_OUTPUT_MILLION_PRICE_CNY: ${QUESTION_IMPORT_S2_OUTPUT_MILLION_PRICE_CNY:-2.7}
    command: >-
      sh -c "python -m scripts.repair_migration_0034 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    working_dir: /app/backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
